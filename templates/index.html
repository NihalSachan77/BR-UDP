<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RG RIFAT 07</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-base: #030014;
            --bg-card: rgba(10, 8, 28, 0.72);
            --bg-card-hover: rgba(18, 14, 48, 0.88);
            --border-card: rgba(0, 242, 254, 0.10);
            --border-hover: rgba(0, 242, 254, 0.45);
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --accent-purple: #a855f7;
            --accent-magenta: #d946ef;
            --accent-green: #00ff88;
            --accent-red: #ff3366;
            --accent-amber: #ffaa00;
            --accent-pink: #ec4899;
            --text-main: #f0f4fc;
            --text-muted: #7a8ba8;
            --glass-glow: 0 8px 40px 0 rgba(0, 242, 254, 0.07);
            --neon-glow: 0 0 30px rgba(0, 242, 254, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        html { scroll-behavior: smooth; }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(ellipse at 10% 0%, rgba(168, 85, 247, 0.20) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 100%, rgba(0, 242, 254, 0.16) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(217, 70, 239, 0.06) 0%, transparent 60%),
                linear-gradient(180deg, #030014 0%, #0a0618 50%, #050210 100%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated grid background */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(0, 242, 254, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.025) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
            mask-image: radial-gradient(ellipse at 50% 50%, black 20%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse at 50% 50%, black 20%, transparent 75%);
        }

        .container {
            max-width: 1480px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ===== HEADER ===== */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 26px;
            background: linear-gradient(135deg, rgba(13, 10, 34, 0.85), rgba(8, 6, 22, 0.85));
            border: 1px solid var(--border-card);
            border-radius: 22px;
            backdrop-filter: blur(24px);
            box-shadow: var(--glass-glow), inset 0 1px 0 rgba(255,255,255,0.05);
            margin-bottom: 22px;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), var(--accent-magenta), transparent);
            opacity: 0.7;
        }

        header::after {
            content: '';
            position: absolute;
            top: -50%; right: -10%;
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.12), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
            z-index: 1;
        }

        .logo-box {
            width: 54px;
            height: 54px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple), var(--accent-magenta));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #fff;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.35), 0 0 60px rgba(168, 85, 247, 0.2);
            animation: pulse-glow 3s infinite alternate;
            position: relative;
            overflow: hidden;
        }

        .logo-box::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.3) 50%, transparent 60%);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%); }
            100% { transform: translateX(100%) translateY(100%); }
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 20px rgba(0, 242, 254, 0.3), 0 0 40px rgba(168, 85, 247, 0.1); }
            100% { box-shadow: 0 0 35px rgba(0, 242, 254, 0.5), 0 0 70px rgba(168, 85, 247, 0.3); }
        }

        .brand-text h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 21px;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #fff 0%, var(--accent-cyan) 40%, var(--accent-magenta) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .brand-text h1 .bot-label {
            font-family: 'Outfit', sans-serif;
            font-weight: 400;
            color: var(--text-muted);
            font-size: 14px;
            -webkit-text-fill-color: var(--text-muted);
        }

        .brand-text p {
            font-size: 12.5px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 4px;
        }

        .live-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 255, 136, 0.10);
            border: 1px solid rgba(0, 255, 136, 0.30);
            color: var(--accent-green);
            padding: 3px 11px;
            border-radius: 20px;
            font-size: 10.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: blink 1.2s infinite;
            box-shadow: 0 0 8px var(--accent-green);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.35; transform: scale(0.75); }
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            z-index: 1;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            outline: none;
            font-family: 'Outfit', sans-serif;
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan) 50%, var(--accent-green));
            color: #02060d;
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.4) 50%, transparent 60%);
            transform: translateX(-100%);
            transition: transform 0.5s;
        }

        .btn-primary:hover::after { transform: translateX(100%); }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(0, 242, 254, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-card);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background: rgba(0, 242, 254, 0.08);
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        /* ===== STATS GRID ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 16px;
            margin-bottom: 22px;
        }

        .stat-card {
            background: linear-gradient(145deg, rgba(13, 10, 34, 0.80), rgba(8, 6, 22, 0.80));
            border: 1px solid var(--border-card);
            border-radius: 18px;
            padding: 20px;
            backdrop-filter: blur(18px);
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 3px; height: 100%;
            border-radius: 3px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .stat-card:nth-child(1)::before { background: var(--accent-cyan); }
        .stat-card:nth-child(2)::before { background: var(--accent-green); }
        .stat-card:nth-child(3)::before { background: var(--accent-purple); }
        .stat-card:nth-child(4)::before { background: var(--accent-amber); }

        .stat-card:hover::before { opacity: 1; }

        .stat-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-4px);
            box-shadow: var(--glass-glow), 0 0 30px rgba(0, 242, 254, 0.08);
        }

        .stat-icon {
            width: 52px;
            height: 52px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            flex-shrink: 0;
            position: relative;
        }

        .stat-icon::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 17px;
            opacity: 0.4;
            filter: blur(6px);
            z-index: -1;
        }

        .stat-icon.cyan { background: rgba(0, 242, 254, 0.13); color: var(--accent-cyan); }
        .stat-icon.cyan::after { background: rgba(0, 242, 254, 0.3); }
        .stat-icon.green { background: rgba(0, 255, 136, 0.13); color: var(--accent-green); }
        .stat-icon.green::after { background: rgba(0, 255, 136, 0.3); }
        .stat-icon.purple { background: rgba(168, 85, 247, 0.13); color: var(--accent-purple); }
        .stat-icon.purple::after { background: rgba(168, 85, 247, 0.3); }
        .stat-icon.amber { background: rgba(255, 170, 0, 0.13); color: var(--accent-amber); }
        .stat-icon.amber::after { background: rgba(255, 170, 0, 0.3); }

        .stat-content h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #fff;
            line-height: 1.1;
        }

        .stat-content p {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            margin-top: 2px;
            letter-spacing: 0.3px;
        }

        /* ===== MAIN LAYOUT ===== */
        .dashboard-main {
            display: grid;
            grid-template-columns: 1.65fr 1fr;
            gap: 22px;
        }

        @media (max-width: 1100px) {
            .dashboard-main { grid-template-columns: 1fr; }
        }

        /* ===== CARD BOX ===== */
        .card-box {
            background: linear-gradient(160deg, rgba(13, 10, 34, 0.80), rgba(8, 6, 22, 0.80));
            border: 1px solid var(--border-card);
            border-radius: 22px;
            padding: 22px;
            backdrop-filter: blur(24px);
            position: relative;
            overflow: hidden;
        }

        .card-box::before {
            content: '';
            position: absolute;
            top: 0; left: 15%; right: 15%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 242, 254, 0.35), rgba(168, 85, 247, 0.35), transparent);
        }

        .box-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .box-title {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.2px;
        }

        .box-title .title-icon-wrap {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .accounts-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* ===== ACCOUNT CARD ===== */
        .account-card {
            background: linear-gradient(145deg, rgba(8, 12, 28, 0.75), rgba(5, 8, 20, 0.85));
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 18px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .account-card::before {
            content: '';
            position: absolute;
            left: 0; top: 20%;
            bottom: 20%;
            width: 2.5px;
            background: linear-gradient(180deg, var(--accent-cyan), var(--accent-purple));
            border-radius: 3px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .account-card:hover::before { opacity: 1; }

        .account-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            transform: translateX(4px);
            box-shadow: 0 4px 24px rgba(0, 242, 254, 0.06);
        }

        .acc-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .acc-profile {
            display: flex;
            align-items: center;
            gap: 13px;
            min-width: 0;
        }

        .acc-avatar {
            width: 46px;
            height: 46px;
            border-radius: 13px;
            background: linear-gradient(135deg, #1a1535, #2a2050);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 17px;
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 242, 254, 0.22);
            flex-shrink: 0;
            position: relative;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.08);
        }

        .acc-info h4 {
            font-size: 15.5px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .region-badge {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.20), rgba(0, 242, 254, 0.15));
            color: #c4b5fd;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 9.5px;
            font-weight: 800;
            letter-spacing: 0.5px;
            border: 1px solid rgba(168, 85, 247, 0.25);
        }

        .acc-info span {
            font-size: 11.5px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.2px;
        }

        .acc-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .status-online {
            background: rgba(0, 255, 136, 0.10);
            color: var(--accent-green);
            border: 1px solid rgba(0, 255, 136, 0.25);
        }

        .status-match {
            background: rgba(0, 242, 254, 0.12);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 242, 254, 0.4);
            animation: pulse-border 1.5s infinite alternate;
        }

        @keyframes pulse-border {
            0% { border-color: rgba(0, 242, 254, 0.25); box-shadow: 0 0 0 rgba(0,242,254,0); }
            100% { border-color: rgba(0, 242, 254, 0.85); box-shadow: 0 0 12px rgba(0,242,254,0.15); }
        }

        /* ===== EXP BOX ===== */
        .exp-box {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            background: rgba(0, 0, 0, 0.30);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 13px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .exp-item {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .exp-label {
            font-size: 9.5px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.6px;
        }

        .exp-val {
            font-size: 14px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: #fff;
        }

        .exp-gained { color: var(--accent-green) !important; }

        .gained-badge {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.18), rgba(0, 255, 136, 0.08));
            padding: 3px 9px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid rgba(0, 255, 136, 0.20);
        }

        /* ===== PROGRESS BAR ===== */
        .level-progress { margin-bottom: 13px; }

        .level-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11.5px;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .progress-bar-bg {
            height: 7px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green));
            border-radius: 10px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
        }

        .progress-bar-fill::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
            animation: progress-shine 2s infinite;
        }

        @keyframes progress-shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* ===== ACTIONS ===== */
        .acc-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 11px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 11px;
            color: var(--text-muted);
            gap: 10px;
        }

        .action-btns { display: flex; gap: 7px; }

        .icon-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-card);
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.22s ease;
            font-size: 12px;
        }

        .icon-btn:hover {
            background: rgba(0, 242, 254, 0.12);
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
            transform: scale(1.08);
        }

        .icon-btn.danger:hover {
            background: rgba(255, 51, 102, 0.12);
            color: var(--accent-red);
            border-color: var(--accent-red);
        }

        /* ===== LOGS ===== */
        .logs-box {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .log-stream {
            flex: 1;
            min-height: 460px;
            max-height: 640px;
            background: #02010a;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11.5px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 7px;
            position: relative;
        }

        .log-stream::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 30px;
            background: linear-gradient(180deg, #02010a, transparent);
            pointer-events: none;
            z-index: 1;
        }

        .log-stream::-webkit-scrollbar { width: 5px; }
        .log-stream::-webkit-scrollbar-track { background: transparent; }
        .log-stream::-webkit-scrollbar-thumb {
            background: rgba(0, 242, 254, 0.15);
            border-radius: 3px;
        }
        .log-stream::-webkit-scrollbar-thumb:hover { background: rgba(0, 242, 254, 0.3); }

        .log-item {
            line-height: 1.5;
            word-break: break-word;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }

        .log-time { color: #4b5875; margin-right: 7px; }
        .log-info { color: #38bdf8; }
        .log-success { color: #4ade80; }
        .log-warning { color: #fbbf24; }
        .log-error { color: #f87171; }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(2, 1, 10, 0.85);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal-card {
            background: linear-gradient(160deg, #0e0a24, #08051a);
            border: 1px solid var(--border-card);
            border-radius: 22px;
            width: 100%;
            max-width: 480px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(0, 242, 254, 0.05);
            position: relative;
            overflow: hidden;
            animation: modal-in 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes modal-in {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-card::before {
            content: '';
            position: absolute;
            top: 0; left: 20%; right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), var(--accent-magenta), transparent);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .modal-header h3 {
            font-size: 17px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .form-group { margin-bottom: 16px; }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 7px;
            letter-spacing: 0.3px;
        }

        .form-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 11px;
            padding: 11px 14px;
            color: #fff;
            font-size: 13.5px;
            outline: none;
            transition: all 0.25s;
            font-family: 'Outfit', sans-serif;
        }

        .form-input:focus {
            border-color: var(--accent-cyan);
            background: rgba(0, 242, 254, 0.04);
            box-shadow: 0 0 0 3px rgba(0, 242, 254, 0.08);
        }

        textarea.form-input {
            resize: vertical;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 46px;
            margin-bottom: 14px;
            color: rgba(255, 255, 255, 0.08);
            display: block;
        }

        .empty-state p {
            font-size: 14px;
            font-weight: 500;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 242, 254, 0.12);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 242, 254, 0.25); }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            body { padding: 14px; }
            header { flex-direction: column; gap: 14px; align-items: flex-start; }
            .header-actions { width: 100%; }
            .header-actions .btn { flex: 1; justify-content: center; }
            .brand-text h1 { font-size: 17px; }
            .exp-box { grid-template-columns: 1fr 1fr; }
            .acc-top { flex-direction: column; align-items: flex-start; }
        }

        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
            .exp-box { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="brand">
                <div class="logo-box">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div class="brand-text">
                    <h1>RG RIFAT 07 <span class="bot-label">| LEVEL UP BOT</span></h1>
                    <p>
                        <span class="live-tag"><span class="pulse-dot"></span> System Live</span>
                        <span>• Safe Multi-Match Engine</span>
                    </p>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="fetchStats()"><i class="fa-solid fa-rotate"></i> Refresh</button>
                <button class="btn btn-primary" onclick="openAddModal()"><i class="fa-solid fa-plus"></i> Add Account</button>
            </div>
        </header>

        <!-- Stats Bar -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon cyan"><i class="fa-solid fa-users"></i></div>
                <div class="stat-content">
                    <h3 id="stat-total-accounts">0</h3>
                    <p>Active Accounts</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green"><i class="fa-solid fa-angles-up"></i></div>
                <div class="stat-content">
                    <h3 id="stat-total-exp" style="color:var(--accent-green)">+0 EXP</h3>
                    <p>Total EXP Gained</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon purple"><i class="fa-solid fa-gamepad"></i></div>
                <div class="stat-content">
                    <h3 id="stat-total-matches">0</h3>
                    <p>Matches Completed</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon amber"><i class="fa-solid fa-shield-halved"></i></div>
                <div class="stat-content">
                    <h3 id="stat-uptime">00:00:00</h3>
                    <p>Bot Uptime</p>
                </div>
            </div>
        </div>

        <!-- Main Dashboard -->
        <div class="dashboard-main">
            <!-- Accounts List -->
            <div class="card-box">
                <div class="box-header">
                    <div class="box-title">
                        <span class="title-icon-wrap" style="background:rgba(0,242,254,0.10); color:var(--accent-cyan);"><i class="fa-solid fa-user-astronaut"></i></span>
                        <span>Live Accounts & EXP Monitor</span>
                    </div>
                </div>
                <div class="accounts-list" id="accounts-container">
                    <div class="empty-state">
                        <i class="fa-solid fa-circle-notch fa-spin"></i>
                        <p>Loading active accounts...</p>
                    </div>
                </div>
            </div>

            <!-- Real-time Logs -->
            <div class="card-box logs-box">
                <div class="box-header">
                    <div class="box-title">
                        <span class="title-icon-wrap" style="background:rgba(0,255,136,0.10); color:var(--accent-green);"><i class="fa-solid fa-terminal"></i></span>
                        <span>Live Match & Bot Logs</span>
                    </div>
                    <span style="font-size:11px; color:var(--text-muted); display:flex; align-items:center; gap:6px;">
                        <span class="pulse-dot" style="width:5px;height:5px;"></span> Real-time
                    </span>
                </div>
                <div class="log-stream" id="log-stream">
                    <!-- Logs inserted dynamically -->
                </div>
            </div>
        </div>
    </div>

    <!-- Add Account Modal -->
    <div class="modal-overlay" id="add-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fa-solid fa-user-plus" style="color:var(--accent-cyan);"></i> Add New Account</h3>
                <button class="icon-btn" onclick="closeAddModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="add-acc-form" onsubmit="submitAddAccount(event)">
                <div class="form-group">
                    <label>Account Type</label>
                    <select class="form-input" id="acc-type" onchange="toggleFormType()">
                        <option value="guest">Guest Account (UID + Password)</option>
                        <option value="token">Access Token</option>
                    </select>
                </div>
                <div id="guest-fields">
                    <div class="form-group">
                        <label>Guest UID</label>
                        <input type="text" class="form-input" id="acc-uid" placeholder="e.g. 7644913583">
                    </div>
                    <div class="form-group">
                        <label>Guest Password / Secret</label>
                        <input type="text" class="form-input" id="acc-password" placeholder="e.g. ZERO_GRAVITY_4NM38">
                    </div>
                </div>
                <div id="token-fields" style="display:none;">
                    <div class="form-group">
                        <label>Access Token</label>
                        <textarea class="form-input" id="acc-token" rows="3" placeholder="Paste access token here..."></textarea>
                    </div>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:22px;">
                    <button type="button" class="btn btn-secondary" onclick="closeAddModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Save & Start</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let startTime = Date.now();

        function openAddModal() {
            document.getElementById('add-modal').classList.add('active');
        }

        function closeAddModal() {
            document.getElementById('add-modal').classList.remove('active');
        }

        function toggleFormType() {
            const type = document.getElementById('acc-type').value;
            document.getElementById('guest-fields').style.display = type === 'guest' ? 'block' : 'none';
            document.getElementById('token-fields').style.display = type === 'token' ? 'block' : 'none';
        }

        async function submitAddAccount(e) {
            e.preventDefault();
            const type = document.getElementById('acc-type').value;
            let payload = {};
            if (type === 'guest') {
                const uid = document.getElementById('acc-uid').value.trim();
                const password = document.getElementById('acc-password').value.trim();
                if (!uid || !password) return alert('Please enter both UID and Password');
                payload = { uid, password };
            } else {
                const token = document.getElementById('acc-token').value.trim();
                if (!token) return alert('Please enter token');
                payload = { token };
            }

            try {
                const res = await fetch('/api/account/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.status === 'ok') {
                    closeAddModal();
                    document.getElementById('add-acc-form').reset();
                    fetchStats();
                } else {
                    alert('Error adding account: ' + (data.error || 'Unknown'));
                }
            } catch (err) {
                alert('Request failed: ' + err);
            }
        }

        async function deleteAccount(uid) {
            if (!confirm('Are you sure you want to remove account ' + uid + '?')) return;
            try {
                await fetch('/api/account/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid })
                });
                fetchStats();
            } catch (err) {
                console.error(err);
            }
        }

        async function refreshAccountInfo(uid) {
            try {
                await fetch('/api/account/refresh', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid })
                });
                fetchStats();
            } catch (err) {
                console.error(err);
            }
        }

        async function fetchStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();

                document.getElementById('stat-total-accounts').innerText = data.total_accounts;
                document.getElementById('stat-total-exp').innerText = '+' + data.total_gained_exp.toLocaleString() + ' EXP';
                document.getElementById('stat-total-matches').innerText = data.total_matches;

                // Render Accounts
                const container = document.getElementById('accounts-container');
                if (data.accounts.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fa-solid fa-ghost"></i>
                            <p>No active accounts running. Click "+ Add Account" to start!</p>
                        </div>
                    `;
                } else {
                    container.innerHTML = data.accounts.map(acc => {
                        const gainedExp = acc.gained_exp || 0;
                        const statusClass = acc.status === 'IN_MATCH' ? 'status-match' : 'status-online';
                        const statusText = acc.status === 'IN_MATCH' ? `In Match (${acc.active_matches} active)` : acc.status;

                        return `
                            <div class="account-card">
                                <div class="acc-top">
                                    <div class="acc-profile">
                                        <div class="acc-avatar"><i class="fa-solid fa-user"></i></div>
                                        <div class="acc-info">
                                            <h4>${escapeHtml(acc.nickname)} <span class="region-badge">${acc.region || 'BD'}</span></h4>
                                            <span>UID: ${acc.uid}</span>
                                        </div>
                                    </div>
                                    <div class="acc-status ${statusClass}">
                                        <span class="pulse-dot"></span>
                                        <span>${statusText}</span>
                                    </div>
                                </div>

                                <div class="exp-box">
                                    <div class="exp-item">
                                        <span class="exp-label">Initial EXP</span>
                                        <span class="exp-val">${acc.initial_exp.toLocaleString()}</span>
                                    </div>
                                    <div class="exp-item">
                                        <span class="exp-label">Current EXP</span>
                                        <span class="exp-val">${acc.current_exp.toLocaleString()}</span>
                                    </div>
                                    <div class="exp-item">
                                        <span class="exp-label">EXP Gained</span>
                                        <span class="exp-val exp-gained">
                                            <span class="gained-badge">+${gainedExp.toLocaleString()} EXP</span>
                                        </span>
                                    </div>
                                </div>

                                <div class="level-progress">
                                    <div class="level-labels">
                                        <span style="color:var(--accent-cyan)">Level ${acc.level}</span>
                                        <span style="color:var(--text-muted)">Matches: ${acc.matches_played}</span>
                                    </div>
                                    <div class="progress-bar-bg">
                                        <div class="progress-bar-fill" style="width: ${Math.min(100, Math.max(15, (acc.current_exp % 1000) / 10))}%"></div>
                                    </div>
                                </div>

                                <div class="acc-actions">
                                    <span>Last match: ${acc.last_match_time || 'Running...'}</span>
                                    <div class="action-btns">
                                        <button class="icon-btn" title="Refresh Profile/EXP" onclick="refreshAccountInfo('${acc.uid}')"><i class="fa-solid fa-rotate"></i></button>
                                        <button class="icon-btn danger" title="Delete Account" onclick="deleteAccount('${acc.uid}')"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                }

                // Render Logs
                const logContainer = document.getElementById('log-stream');
                logContainer.innerHTML = data.logs.map(log => {
                    return `<div class="log-item"><span class="log-time">[${log.time}]</span><span class="log-${log.level}">${escapeHtml(log.message)}</span></div>`;
                }).join('');
                logContainer.scrollTop = logContainer.scrollHeight;

            } catch (err) {
                console.error("Failed to fetch stats:", err);
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // Uptime counter
        setInterval(() => {
            const sec = Math.floor((Date.now() - startTime) / 1000);
            const h = String(Math.floor(sec / 3600)).padStart(2, '0');
            const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
            const s = String(sec % 60).padStart(2, '0');
            document.getElementById('stat-uptime').innerText = `${h}:${m}:${s}`;
        }, 1000);

        // Live Poll every 2.5s
        fetchStats();
        setInterval(fetchStats, 2500);
    </script>
</body>
</html>
